services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    restart : always
    environment:
      - DATABASE_URI=postgresql://user:password@db:5432/db
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    volumes:
      - "emailer_data:/var/lib/postgresql/data"
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U user -d db"]
          interval: 5s
          timeout: 5s
          retries: 5
volumes:
  emailer_data:
